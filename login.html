<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | istek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 로그인 -->
  <section class="section join join--alone">
    <a href="index.html" class="join__logo" aria-label="istek 홈"><img src="images/logo.svg" alt="istek"></a>
    <h2 class="title">Login<span>,</span></h2>
    <p class="join__desc">이스텍 회원 서비스를 이용하시려면 로그인해 주세요.</p>

    <form class="join-form" id="loginForm" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <p class="field__msg"></p>
      </div>

      <p class="field__msg join-form__error" id="loginMsg" role="alert"></p>
      <button type="submit" class="join-form__submit">로그인</button>
      <p class="join-form__alt">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p>
      <p class="join-form__alt join-form__alt--sub"><a href="reset.html">비밀번호를 잊으셨나요?</a></p>
    </form>

    <!-- 이미 로그인한 경우 -->
    <div class="join-form login-done" id="loginDone" hidden>
      <p class="login-done__msg"><strong id="loginName"></strong>님, 로그인되어 있습니다.</p>
      <a href="index.html" class="join-form__submit">메인으로</a>
      <button type="button" class="join-form__sub" id="logoutBtn">로그아웃</button>
    </div>
  </section>


  <!-- TOP 버튼 -->
  <button type="button" class="top-btn" id="topBtn" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
    <span>TOP</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | istek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="header__left">
      <button type="button" class="hamburger" id="menuOpen" aria-label="메뉴 열기" aria-expanded="false" aria-controls="drawer">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <a href="index.html" class="header__logo" aria-label="istek 홈"><img src="images/logo.svg" alt="istek"></a>
    <div class="header__right">
      <a href="#" class="icon" aria-label="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </a>
      <a href="#" class="icon" aria-label="장바구니">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      </a>
      <a href="login.html" class="icon" aria-label="로그인">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </a>
    </div>
  </header>

  <!-- 사이드 메뉴 -->
  <div class="overlay" id="overlay"></div>
  <nav class="drawer" id="drawer" aria-label="메인 메뉴" aria-hidden="true">
    <div class="drawer__head">
      <img src="images/logo.svg" alt="istek">
      <button type="button" class="drawer__close" id="menuClose" aria-label="메뉴 닫기">
        <span></span><span></span>
      </button>
    </div>
    <ul class="menu">
      <li class="menu__item">
        <button type="button" class="menu__toggle" aria-expanded="false">브랜드별<i></i></button>
        <div class="menu__sub"><ul>
          <li><a href="#">istek</a></li>
          <li><a href="#">HUMAS</a></li>
          <li><a href="#">miraest</a></li>
          <li><a href="#">evergreenTop</a></li>
          <li><a href="#">analytik-jena</a></li>
        </ul></div>
      </li>
      <li class="menu__item">
        <button type="button" class="menu__toggle" aria-expanded="false">제품 카테고리<i></i></button>
        <div class="menu__sub"><ul>
          <!-- TODO: 실제 카테고리로 교체 -->
          <li><a href="#">카테고리 1</a></li>
          <li><a href="#">카테고리 2</a></li>
          <li><a href="#">카테고리 3</a></li>
        </ul></div>
      </li>
      <li class="menu__item"><a class="menu__link" href="index.html#service">견적 문의</a></li>
      <li class="menu__item"><a class="menu__link" href="index.html#service">고객지원</a></li>
      <li class="menu__item"><a class="menu__link" href="#">회사소개 / 오시는 길</a></li>
    </ul>
  </nav>

  <!-- 로그인 -->
  <section class="section join join--alone">
    <h2 class="title">Login<span>,</span></h2>
    <p class="join__desc">이스텍 회원 서비스를 이용하시려면 로그인해 주세요.</p>

    <form class="join-form" id="loginForm" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <p class="field__msg"></p>
      </div>

      <p class="field__msg join-form__error" id="loginMsg" role="alert"></p>
      <button type="submit" class="join-form__submit">로그인</button>
      <p class="join-form__alt">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p>
      <p class="join-form__alt join-form__alt--sub"><a href="reset.html">비밀번호를 잊으셨나요?</a></p>
    </form>

    <!-- 이미 로그인한 경우 -->
    <div class="join-form login-done" id="loginDone" hidden>
      <p class="login-done__msg"><strong id="loginName"></strong>님, 로그인되어 있습니다.</p>
      <a href="index.html" class="join-form__submit">메인으로</a>
      <button type="button" class="join-form__sub" id="logoutBtn">로그아웃</button>
    </div>
  </section>


  <!-- TOP 버튼 -->
  <button type="button" class="top-btn" id="topBtn" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
    <span>TOP</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

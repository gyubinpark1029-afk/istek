<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 | istek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 비밀번호 찾기 -->
  <section class="section join join--alone">
    <a href="index.html" class="join__logo" aria-label="istek 홈"><img src="images/logo.svg" alt="istek"></a>
    <h2 class="title">Password<span>,</span></h2>
    <p class="join__desc" id="resetDesc">가입하신 이메일을 입력하시면 비밀번호 재설정 링크를 보내 드립니다.</p>

    <!-- 1단계: 재설정 메일 요청 -->
    <form class="join-form" id="requestForm" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username">
        <p class="field__msg"></p>
      </div>
      <p class="field__msg join-form__error" id="requestMsg" role="alert"></p>
      <button type="submit" class="join-form__submit">재설정 메일 받기</button>
      <p class="join-form__alt"><a href="login.html">로그인으로 돌아가기</a></p>
    </form>

    <!-- 메일 발송 완료 -->
    <div class="join-form login-done" id="sentDone" hidden>
      <p class="login-done__msg"><strong id="sentEmail"></strong>(으)로<br>재설정 메일을 보냈습니다.</p>
      <p class="join-form__alt">메일이 오지 않으면 스팸함을 확인하거나, 가입한 이메일이 맞는지 확인해 주세요.</p>
      <a href="login.html" class="join-form__submit">로그인으로</a>
    </div>

    <!-- 2단계: 메일의 링크로 들어온 경우 새 비밀번호 입력 -->
    <form class="join-form" id="updateForm" novalidate hidden>
      <div class="field">
        <label for="password">새 비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="영문, 숫자, 특수문자 포함 8자 이상">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="passwordConfirm">새 비밀번호 확인</label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password">
        <p class="field__msg"></p>
      </div>
      <p class="field__msg join-form__error" id="updateMsg" role="alert"></p>
      <button type="submit" class="join-form__submit">비밀번호 변경</button>
    </form>
  </section>


  <!-- TOP 버튼 -->
  <button type="button" class="top-btn" id="topBtn" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
    <span>TOP</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reset.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

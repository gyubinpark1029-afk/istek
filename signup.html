<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | istek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 회원가입 -->
  <section class="section join join--alone">
    <a href="index.html" class="join__logo" aria-label="istek 홈"><img src="images/logo.svg" alt="istek"></a>
    <h2 class="title">Join<span>,</span></h2>
    <p class="join__desc">이스텍 회원이 되어 견적 문의와 주문 내역을 편하게 확인하세요.</p>

    <form class="join-form" id="joinForm" novalidate>
      <div class="field">
        <label for="userName">이름 <em>*</em></label>
        <input type="text" id="userName" name="userName" autocomplete="name">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="email">이메일 <em>*</em></label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="로그인할 때 사용합니다">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="password">비밀번호 <em>*</em></label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="영문, 숫자, 특수문자 포함 8자 이상">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="passwordConfirm">비밀번호 확인 <em>*</em></label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password">
        <p class="field__msg"></p>
      </div>
      <div class="field">
        <label for="phone">전화번호 <em>*</em></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="010-0000-0000">
        <p class="field__msg"></p>
      </div>

      <div class="agree">
        <label class="agree__all"><input type="checkbox" id="agreeAll"> 전체 동의</label>
        <label><input type="checkbox" name="agree" class="agree__item" required> [필수] 이용약관 동의 <a href="#">보기</a></label>
        <label><input type="checkbox" name="agree" class="agree__item" required> [필수] 개인정보 수집 및 이용 동의 <a href="#">보기</a></label>
        <label><input type="checkbox" name="agree" class="agree__item"> [선택] 마케팅 정보 수신 동의</label>
        <p class="field__msg" id="agreeMsg"></p>
      </div>

      <button type="submit" class="join-form__submit">가입하기</button>
      <p class="join-form__alt">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </form>
  </section>

  <!-- TOP 버튼 -->
  <button type="button" class="top-btn" id="topBtn" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
    <span>TOP</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
